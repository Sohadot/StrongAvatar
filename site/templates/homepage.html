<!-- Non-public homepage template shell. Does not create public output. -->
<div class="homepage-shell identity-field" data-template-scope="homepage-shell-only">
  <section class="homepage-region homepage-region--hero field-surface" aria-labelledby="homepage-hero">
    <div id="homepage-hero" class="metadata">{{ homepage_hero }}</div>
    <div class="panel">{{ foundational_line }}</div>
  </section>

  <section class="homepage-region homepage-region--thesis field-surface" aria-labelledby="homepage-thesis">
    <div id="homepage-thesis" class="metadata">{{ category_thesis }}</div>
  </section>

  <section class="homepage-region homepage-region--protocol protocol-grid" aria-labelledby="homepage-protocol">
    <div id="homepage-protocol" class="metadata">{{ protocol_overview }}</div>
  </section>

  <section class="homepage-region homepage-region--governance field-surface" aria-labelledby="homepage-governance">
    <div id="homepage-governance" class="metadata">{{ digital_likeness_governance }}</div>
  </section>

  <section class="homepage-region homepage-region--reference protocol-grid" aria-labelledby="homepage-reference">
    <div id="homepage-reference" class="metadata">{{ reference_system_sections }}</div>
  </section>

  <section class="homepage-region homepage-region--audience field-surface" aria-labelledby="homepage-audience">
    <div id="homepage-audience" class="metadata">{{ audience_segments }}</div>
  </section>

  <section class="homepage-region homepage-region--monetization panel" aria-labelledby="homepage-monetization">
    <div id="homepage-monetization" class="metadata">{{ future_monetization_surface }}</div>
  </section>

  <section class="homepage-region homepage-region--acquisition field-surface" aria-labelledby="homepage-acquisition">
    <div id="homepage-acquisition" class="metadata">{{ acquisition_signal }}</div>
  </section>

  <section class="homepage-region homepage-region--trust panel" aria-labelledby="homepage-trust">
    <div id="homepage-trust" class="metadata">{{ trust_and_methodology_links }}</div>
  </section>
</div>
